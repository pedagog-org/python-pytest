[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pedagog-pytest"
version = "2.3.0"
description = "pytest helper for pedagog: test metadata, results.yaml output, process isolation"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["pytest>=8,<9", "rpyc>=6,<7"]

[project.optional-dependencies]
dev = ["mypy>=1.11"]

[project.scripts]
pedagog-run-tests = "pedagog_pytest.launcher:main"

[project.entry-points.pytest11]
pedagog = "pedagog_pytest.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pedagog_pytest = ["py.typed"]

[tool.mypy]
strict = true
files = ["src"]

# rpyc ships no type information.
[[tool.mypy.overrides]]
module = ["rpyc", "rpyc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
